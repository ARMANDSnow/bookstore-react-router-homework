<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知页书城 - 购物车</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="cart">
  <header class="site-header">
    <div class="brand-block">
      <a class="brand" href="../index.html">知页书城</a>
      <p class="brand-text">精选图书与沉浸式阅读生活方式</p>
    </div>
    <nav class="site-nav" aria-label="主导航">
      <a href="../index.html">登录</a>
      <a href="books.html">首页</a>
      <a href="detail.html">详情</a>
      <a href="cart.html" aria-current="page">购物车 <span class="cart-count" data-cart-count>0</span></a>
      <a href="orders.html">订单</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="cart-layout">
      <article class="cart-panel">
        <header class="section-header compact">
          <p class="eyebrow">Shopping Cart</p>
          <h1>我的购物车</h1>
          <p>可在此调整数量、查看小计并模拟提交订单。</p>
        </header>

        <section class="cart-list" id="cartList" aria-label="购物车商品列表"></section>
      </article>

      <aside class="summary-panel">
        <header class="section-header compact">
          <h2>订单汇总</h2>
        </header>
        <dl class="summary-list">
          <div>
            <dt>商品总数</dt>
            <dd id="summaryCount">0 件</dd>
          </div>
          <div>
            <dt>商品金额</dt>
            <dd id="summarySubtotal">¥0.00</dd>
          </div>
          <div>
            <dt>配送费用</dt>
            <dd id="summaryShipping">¥0.00</dd>
          </div>
          <div class="summary-total">
            <dt>应付金额</dt>
            <dd id="summaryTotal">¥0.00</dd>
          </div>
        </dl>
        <div class="summary-actions">
          <button class="button button-primary" id="checkoutButton" type="button">提交订单</button>
          <a class="button button-secondary" href="books.html">继续购书</a>
        </div>
        <p class="form-message" id="cartMessage" aria-live="polite"></p>
      </aside>
    </section>
  </main>

  <script src="../js/app.js"></script>
</body>
</html>
