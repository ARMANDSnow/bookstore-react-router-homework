<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知页书城 - 订单页</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="orders">
  <header class="site-header">
    <div class="brand-block">
      <a class="brand" href="../index.html">知页书城</a>
      <p class="brand-text">精选图书与沉浸式阅读生活方式</p>
    </div>
    <nav class="site-nav" aria-label="主导航">
      <a href="../index.html">登录</a>
      <a href="books.html">首页</a>
      <a href="detail.html">详情</a>
      <a href="cart.html">购物车 <span class="cart-count" data-cart-count>0</span></a>
      <a href="orders.html" aria-current="page">订单</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="orders-header">
      <header class="section-header">
        <p class="eyebrow">Order Center</p>
        <h1>订单页</h1>
        <p>展示最近订单、订单状态与收货信息。购物车提交后，新的模拟订单会出现在这里。</p>
      </header>
      <a class="button button-secondary" href="books.html">继续浏览书籍</a>
    </section>

    <section class="orders-grid" id="ordersList">
      <article class="order-card">
        <header class="order-top">
          <div>
            <h2>订单号 ZY20260322001</h2>
            <p>下单时间：2026-03-22 10:18</p>
          </div>
          <span class="status-tag success">已发货</span>
        </header>
        <ul class="order-items">
          <li>《深度工作》 x 1</li>
          <li>《设计心理学》 x 1</li>
        </ul>
        <footer class="order-bottom">
          <p>收货人：张同学</p>
          <strong>合计：¥123.00</strong>
        </footer>
      </article>
    </section>
  </main>

  <script src="../js/app.js"></script>
</body>
</html>
